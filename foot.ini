shell=fish
title=foot
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=1
alpha-mode=matching
blur=no

[colors-dark]
foreground=242424
background=ffffff
regular0=ffffff
regular1=ffffff
regular2=ffffff
regular3=ffffff
regular4=ffffff
regular5=ffffff
regular6=ffffff
regular7=ffffff
bright0=ffffff
bright1=ffffff
bright2=ffffff
bright3=ffffff
bright4=ffffff
bright5=ffffff
bright6=ffffff
bright7=ffffff

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
